# Add this to your existing global redirect block server_name list:
# llm-gateway.techxbytes.com

# ======================================================================
# LLM GATEWAY (Subdomain)
# ======================================================================
server {
    listen 443 ssl http2;
    server_name llm-gateway.techxbytes.com;

    # SSL (Reuse existing certs if they cover the subdomain, 
    # OR generate a new one specifically for this subdomain)
    ssl_certificate     /etc/letsencrypt/live/techxbytes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techxbytes.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Proxy to the Docker container mapped on host port 8089
        proxy_pass http://localhost:8089;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OPTIONAL: CORS (if needed)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }
}
